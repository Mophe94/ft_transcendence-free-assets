name: Update Architecture Diagram

on:
  push:
    paths:
      - 'architecture_diagram.mmd'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-slim

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Install Mermaid CLI
      run: npm install -g @mermaid-js/mermaid-cli

    - name: Install Chromium (system)
      run: sudo apt-get update && sudo apt-get install -y chromium
      env:
        PUPETEER_EXECUTABLE_PATH: /usr/bin/chromium-browser

    - name: Generate SVG
      run: mmdc -i architecture_diagram.mmd -o architecture_diagram.svg
