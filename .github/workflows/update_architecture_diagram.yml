name: Update Architecture Diagram

on:
  push:
    paths:
      - 'architecture_diagram.mmd'

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-slim

  steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install Mermaid
      run: npm install -g @mermaid-js/mermaid-cli

    - name: Generate SVG
      run: mmdc -i architecture_diagram.mmd -o architecture_diagram.svg

    - name: Commit SVG
      run: |
        git config user.name "github-actions"
        git config user.email "github-actions@github.com

        git add architecture_diagram.svg

        if git diff --cached --quiet; then
          echo "No changes"
        else
          git commit -m"Updated architecture diagram for the README"
          git push
        fi
