name: Update Architecture Diagram

on:
  push:
    paths:
      - 'architecture_diagram.mmd'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-slim

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Install Mermaid CLI
      run: npm install -g @mermaid-js/mermaid-cli

    - name: Install Chromium (system)
      run: sudo apt-get update && sudo apt-get install -y chromium
        
    - name: Install Chromium dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
        chromium-browser \
        libatk1.0-0 \
        libatk-bridge2.0-0 \
        libcups2 \
        libnss3 \
        libxss1 \
        libasound2 \
        libgbm1 \
        libgtk-3-0 \
        libdrm2 \
        libx11-xcb1 \
        libxcomposite1 \
        libxdamage1 \
        libxfixes3 \
        libxrandr2 \
        libpangocairo-1.0-0 \
        libpango-1.0-0 \
        libatspi2.0-0

    - name: Generate SVG
      run:
        export PUPPETEER_EXECUTABLE_PATH=/usr/bin/chromium-browser
        mmdc -i architecture_diagram.mmd -o architecture_diagram.svg
