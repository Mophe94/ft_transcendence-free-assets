services:
 nginx:
  image: nginx:latest
  container_name: nginx
  ports:
   - "8080:80"
  volumes:
   - ./nginx_test.conf:/etc/nginx/conf.d/default.conf:ro
  networks:
   - transcendence
  restart: always
  depends_on:
   - kevin_site

 kevin_site:
  build:
   context: ./kevin_site
   dockerfile: Dockerfile
  container_name: kevin_site
  restart: always
  expose:
   - "5173"
  networks:
   - transcendence

