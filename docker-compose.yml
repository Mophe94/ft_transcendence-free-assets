services:
  frontend:
    build:
      context: site
    container_name: frontend
    ports:
      - "5173:5173"
    env_file:
    - site/.env
    volumes:
      - ./site:/app
      - frontend_modules:/app/node_modules

  game_service:
    build:
      context: backend
    container_name: game_service
    command: npm run start:dev game-service
    ports:
      - "8081:8081"
      - "8082:8082"
    env_file:
      - backend/.env.docker
    depends_on:
      users_db:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - game_service_modules:/app/node_modules
  chat_service:
    build:
      context: backend
    container_name: chat_service
    command: npm run start:dev chat-service
    ports:
      - "3001:3001"
    env_file:
      - backend/.env.docker
    volumes:
      - ./backend:/app
      - chat_service_modules:/app/node_modules
  users_service:
    build:
      context: backend
    container_name: users_service
    command: npm run start:dev account-service
    ports:
      - "3000:3000"
    env_file:
      - backend/.env.docker
    depends_on:
      users_db:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - users_service_modules:/app/node_modules
  game:
    build:
      context: game_test
    container_name: game
    ports:
      - "8060:8060"
    volumes:
      - ./game_test:/app

  users_db:
    build:
      context: database/users_db/
    container_name: users_db
    ports:
      - "5433:5432"
    env_file:
      - database/users_db/.env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s   # Teste toutes les 3 secondes
      timeout: 5s    # Temps max accordé au test
      retries: 5     # Nombre d'essais avant de considérer la DB comme en panne
      start_period: 5s # Laisse 5 secondes au démarrage avant de commencer à tester
  game_db:
    build:
      context: database/game_db/
    container_name: game_db
    ports:
      - "5434:5432"
    env_file:
      - database/game_db/.env

volumes:
  frontend_modules:
  game_service_modules:
  users_service_modules:
  chat_service_modules:
