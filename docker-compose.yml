services:
  nginx:
    build:
      context: nginx
    container_name: nginx
    depends_on:
      - users_service
    env_file:
      - nginx/.env
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - nginx_ssl:/etc/nginx/ssl
    

  frontend:
    build:
      context: site
    container_name: frontend
    env_file:
      - site/.env
    expose:
      - 5173
    healthcheck:
      test: ["CMD", "node", "/app/healthcheck.js"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 5s
    volumes:
      - ./site:/app
      - /app/node_modules


  game_service:
    build:
      context: backend
    container_name: game_service
    command: npm run start:dev game-service
    depends_on:
      users_db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - backend/.env.docker
    expose:
      - 3000
    healthcheck:
      test: ["CMD", "/app/healthcheck.sh"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 10s
    secrets:
      - db_game_db_name
      - db_game_username
      - db_game_password
      - redis_password
    volumes:
      - ./backend:/app
      - /app/node_modules
    

  chat_service:
    build:
      context: backend
    container_name: chat_service
    command: npm run start:dev chat-service
    env_file:
      - backend/.env.docker
    expose:
      - 3000
    healthcheck:
      test: ["CMD", "/app/healthcheck.sh"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 10s
    secrets:
      - jwt_secret_key
    volumes:
      - ./backend:/app
      - /app/node_modules

  users_service:
    build:
      context: backend
    container_name: users_service
    command: npm run start:dev account-service
    depends_on:
      users_db:
        condition: service_healthy
    env_file:
      - backend/.env.docker
    expose:
      - 3000
    healthcheck:
      test: ["CMD", "/app/healthcheck.sh"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 10s
    secrets:
      - db_users_db_name
      - db_users_username
      - db_users_password
      - fortytwo_client_id
      - fortytwo_client_secret
      - jwt_secret_key
    volumes:
      - ./backend:/app
      - /app/node_modules

  game:
    build:
      context: game_test
    container_name: game
    expose:
      - 8060
    healthcheck:
      test: ["CMD", "node", "/app/healthcheck.js"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 5s
    volumes:
      - ./game_test:/app
      - /app/node_modules

  users_db:
    build:
      context: database/users_db/
    container_name: users_db
    env_file:
      - database/users_db/.env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    secrets:
      - db_users_db_name
      - db_users_username
      - db_users_password
      - db_users_postgres_password
  game_db:
    build:
      context: database/game_db/
    container_name: game_db
    env_file:
      - database/game_db/.env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    secrets:
      - db_game_db_name
      - db_game_username
      - db_game_password
      - db_game_postgres_password

  redis:
    build:
      context: redis/
    container_name: redis
    healthcheck:
      test: ["CMD-SHELL", "/app/healthcheck.sh"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    secrets:
      - redis_password

volumes:
  nginx_ssl:

secrets:
  db_game_db_name:
    file: ./.secrets/db_game_db_name.txt
  db_game_username:
    file: ./.secrets/db_game_username.txt
  db_game_password:
    file: ./.secrets/db_game_password.txt
  db_game_postgres_password:
    file: ./.secrets/db_game_postgres_password.txt
  db_users_db_name:
    file: ./.secrets/db_users_db_name.txt
  db_users_username:
    file: ./.secrets/db_users_username.txt
  db_users_password:
    file: ./.secrets/db_users_password.txt
  db_users_postgres_password:
    file: ./.secrets/db_users_postgres_password.txt
  fortytwo_client_id:
    file: ./.secrets/fortytwo_client_id.txt
  fortytwo_client_secret:
    file: ./.secrets/fortytwo_client_secret.txt
  jwt_secret_key:
    file: ./.secrets/jwt_secret_key.txt
  redis_password:
    file: ./.secrets/redis_password.txt
