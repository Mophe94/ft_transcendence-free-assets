version: "3.8"

services:

  prometheus:
    image: prom/prometheus
    ports:
      - "9090:9090"
    configs:
      - source: prometheus_config
        target: /etc/prometheus/prometheus.yml
    volumes:
      - prom_data:/prometheus
    networks:
      - obs

  grafana:
    image: grafana/grafana
    environment:
      GF_SERVER_ROOT_URL: https://localhost/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_SECURITY_ALLOW_EMBEDDING: "true"

    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - obs
      - shared_net

  cadvisor:
    image: gcr.io/cadvisor/cadvisor
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks:
      - obs
    deploy:
      mode: global

networks:
  obs:
    driver: overlay
    external: false
  shared_net:
    external: true

volumes:
  prom_data:
  grafana_data:

configs:
  prometheus_config:
    file: ./prometheus.yml
