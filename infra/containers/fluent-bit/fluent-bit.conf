[SERVICE]
    Flush 1
    Log_Level info
    Daemon off

    Parsers_File parsers.conf

    HTTPS_Server On
    HTTP_Listen 0.0.0.0
    HTTP_Port 2020

    storage.metrics On
    storage.path /fluent-bit/storage
    storage.sync normal

[INPUT]
    Name tail
    Path /var/lib/docker/containers/*/*.log
    Parser docker
    Tag docker.*
    Mem_Buf_Limit 50MB
    Skip_Long_Lines On
    Refresh_Interval 5
    Rotate_Wait 30

    DB /fluent-bit/storage/flb_kube.db

    storage.type filesystem

[FILTER]
    Name parser
    Match docker.*
    Key_Name log
    Parser json_log
    Reserve_data On
    Preserve_Key On

[FILTER]
    Name modify
    Match docker.*

    Add cluster swarm
    Add node ${HOSTNAME}

[OUTPUT]
    Name loki
    Match docker.*

    Host loki
    Port 3100
    URI /loki/api/v1/push

    Labels cluster=swarm,node=$HOSTNAME

    Line_Format json
    Auto_Kubernetes_Labels off
    Retry_Limit False
    net.keepalive On
    Compress gzip
