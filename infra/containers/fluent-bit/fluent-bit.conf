[SERVICE]
    Flush        1
    Daemon       Off
    Log_Level    info
    Parsers_File parsers.conf

[INPUT]
    Name              tail
    Path              /var/lib/docker/containers/*/*.log
    Parser            docker
    Tag               docker.*
    Mem_Buf_Limit     50MB
    Skip_Long_Lines   On

[FILTER]
    Name   docker
    Match  docker.*
    Labels On
    Container_Name On

[FILTER]
    Name   modify
    Match  docker.*
    Add    cluster swarm

[OUTPUT]
    Name  loki
    Match docker.*
    Host  loki
    Port  3100
    Labels job=fluentbit,service=$container_name
