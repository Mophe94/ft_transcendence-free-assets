# Extracting metadata from dockerswarm
discovery.dockerswarm "linux" {
  host      = "unix:///var/run/docker.sock"
}

discovery.dockerswarm "swarm_tasks" {
    host	= "unix:///var/run/docker.sock"
    role	= "tasks"
}

discovery.relabel  "logs_integrations_dockerswarm" {
  targets  = []
  
  rule {
      source_labels    = [ "__meta_docker_container_name" ] # find service metadata equivalent
      regex            = "/(.*)"
      target_label     = "container_name" # same, apply to service ?
  }
  rule {
      target_label     = "instance"
      replacement      = constants.hostname # does not work, dinf equivalent for dockerswarm
  }
}

# Collecting logs from docker containers
loki.source.docker "default" {
      host             = "unix:///var/run/docker.sock"
      targets          = discovery.dockersarm.swarm_tasks.targets
      relabel_rules    = discovery.relabel.logs_integrations_dockerswarm.rules
      forward_to       = [loki.write.default.receiver]
}

logging {
    level     = "info"
    format    = "json"
    write_to  = [loki.write.default.receiver]
}


loki.write  "default" {
    endpoint {
      url = "http://loki:3100/loki/api/v1/push"
    }
}

# Exporter
prometheus.exporter.unix "host" {
    procfs_path = "/host/proc"
    sysfs_path  = "/host/sys"
    rootfs_path = "/host/root"
    enable_collectors = [
      "cpu", "meminfo", "filesystem", "loadavg", "netdev",
    ]
}

prometheus.exporter.self "self" {}

prometheus.exporter.cadvisor "containers" {
    #docker_host = "unix:///var/run/docker.sock"
	docker_only	= true
}

# Relabeller
discovery.relabel "prom_integrations_dockerswarm" {
    targets = prometheus.exporter.cadvisor.containers.targets
    rule {
        target_label = "job"
        replacement  = "integrations/docker"
    }
    rule {
        target_label = "instance"
        replacement  = "${NODE_HOSTNAME}"
    }
}

discovery.relabel "prom_host_metrics" {
    targets	     = prometheus.exporter.unix.host.targets
    rule {
        target_label = "job"
        replacement  = "integrations/node_exporter"
    }
    rule {
        target_label = "instance"
        replacement  = "${NODE_HOSTNAME}"
    }
}

# Scraper
prometheus.scrape "host_metrics" {
	job_name    	= "node"
	scrape_interval	= "15s"
    targets     	= discovery.relabel.prom_host_metrics.targets      
    forward_to  	= [ prometheus.remote_write.prometheus.receiver ]
}

prometheus.scrape "container_metrics" {
    job_name    	= "container"
	scrape_interval	= "10s"
	targets     	= discovery.relabel.prom_integrations_dockerswarm.targets
    forward_to  	= [ prometheus.remote_write.prometheus.receiver ]
}

# Writer
prometheus.remote_write "prometheus" {
    endpoint {
      url = "http://prometheus:9090/api/v1/write"
    }
}
