// ============================================================
// Docker Swarm discovery
// ============================================================

discovery.dockerswarm "linux" {
  host = "unix:///var/run/docker.sock"
  role = "nodes"
}

discovery.dockerswarm "swarm_tasks" {
  host = "unix:///var/run/docker.sock"
  role = "tasks"
}


// ============================================================
// Swarm task metadata -> Loki labels
// ============================================================

discovery.relabel "logs_integrations_dockerswarm" {
  targets = discovery.dockerswarm.swarm_tasks.targets

  // ----------------------------------------------------------
  // Swarm service
  //
  // observ_grafana
  // core_nginx
  // ----------------------------------------------------------

  rule {
    source_labels = ["__meta_dockerswarm_service_name"]
    target_label  = "service"
  }

  // ----------------------------------------------------------
  // Stack
  //
  // observ_grafana -> observ
  // core_nginx     -> core
  // ----------------------------------------------------------

  rule {
    source_labels = ["__meta_dockerswarm_service_name"]
    regex         = "^([^_]+)_.+$"
    target_label  = "stack"
    replacement   = "$1"
  }

  // ----------------------------------------------------------
  // Service without stack
  //
  // observ_grafana -> grafana
  // core_nginx     -> nginx
  // ----------------------------------------------------------

  rule {
    source_labels = ["__meta_dockerswarm_service_name"]
    regex         = "^[^_]+_(.+)$"
    target_label  = "service_short"
    replacement   = "$1"
  }

  // ----------------------------------------------------------
  // IMPORTANT:
  //
  // This is the join key we'll use later in Prometheus.
  //
  // Swarm:
  //   __meta_dockerswarm_task_container_id
  //
  // becomes:
  //   container_id="c329daa7f82842..."
  // ----------------------------------------------------------

  rule {
    source_labels = ["__meta_dockerswarm_task_container_id"]
    target_label  = "container_id"
  }

  // ----------------------------------------------------------
  // Swarm node
  // ----------------------------------------------------------

  rule {
    source_labels = ["__meta_dockerswarm_node_hostname"]
    target_label  = "instance"
  }
}


// ============================================================
// Docker container logs
// ============================================================

loki.source.docker "default" {
  host = "unix:///var/run/docker.sock"

  targets = discovery.dockerswarm.swarm_tasks.targets

  relabel_rules = discovery.relabel.logs_integrations_dockerswarm.rules

  forward_to = [
    loki.write.default.receiver,
  ]
}


// ============================================================
// Loki
// ============================================================

loki.write "default" {
  endpoint {
    url = "http://loki:3100/loki/api/v1/push"
  }
}

// ============================================================
// cAdvisor container metrics
// ============================================================

prometheus.exporter.cadvisor "containers" {
  docker_host          = "unix:///var/run/docker.sock"
  containerd_host      = "/var/run/docker/containerd/containerd.sock"
  containerd_namespace = "moby"

  docker_only = true

  store_container_labels = false
}


discovery.relabel "prom_integrations_dockerswarm" {
  targets = prometheus.exporter.cadvisor.containers.targets

  rule {
    target_label = "job"
    replacement  = "integrations/docker"
  }

  rule {
    target_label = "instance"
    replacement  = "${NODE_HOSTNAME}"
  }
}


prometheus.scrape "container_metrics" {
  job_name        = "container"
  scrape_interval = "10s"

  targets = discovery.relabel.prom_integrations_dockerswarm.output

  forward_to = [
    prometheus.remote_write.prometheus.receiver,
  ]
}

// ============================================================
// Prometheus remote write
// ============================================================

prometheus.remote_write "prometheus" {
  endpoint {
    url = "http://prometheus:9090/api/v1/write"
  }
}
