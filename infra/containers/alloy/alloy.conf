prometheus.exporter.unix "host" {
    procfs_path = "/host/proc"
    sysfs_path  = "/host/sys"
    rootfs_path = "/host/root"

    enable_collectors = [
      "cpu", "meminfo", "filesystem", "loadavg", "netdev",
    ]
}

prometheus.exporter.self "self" {}

discovery.dockerswarm "swarm_node" {
    host	= "unix:///var/run/docker.sock"
    role	= "nodes"
}

discovery.dockerswarm "swarm_service" {
    host	= "unix:///var/run/docker.sock"
    role	= "services"
}

discovery.dockerswarm "swarm_task" {
    host	= "unix:///var/run/docker.sock"
    role	= "tasks"
}

prometheus.exporter.cadvisor "containers" {
    docker_host = "unix:///var/run/docker.sock"
}


prometheus.scrape "host_metrics" {
    targets     = prometheus.exporter.unix.host.targets

    job_name    = "node"
    
    forward_to  = [ prometheus.remote_write.prometheus.receiver ]
}

prometheus.scrape "container_metrics" {
    targets     = concat(
        prometheus.exporter.self.self.targets,
        prometheus.exporter.cadvisor.containers.targets,
	discovery.dockerswarm.swarm_node.targets,
	discovery.dockerswarm.swarm_service.targets,
	discovery.dockerswarm.swarm_task.targets,
    )

    job_name    = "container"

    forward_to  = [ prometheus.remote_write.prometheus.receiver ]
}


logging {
    level     = "info"
    format    = "json"
    write_to  = [loki.write.default.receiver]
}


prometheus.remote_write "prometheus" {
    endpoint {
      url = "http://prometheus:9090/api/v1/write"
    }
}

loki.write  "default" {
    endpoint {
      url = "http://loki:3100/loki/api/v1/push"
    }
}
