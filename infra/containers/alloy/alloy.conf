discovery.docker "containers" {
  host = "unix:///var/run/docker.sock"
}

discovery.relabel "logs" {

  targets = discovery.docker.containers.targets

  rule {
    source_labels = ["__meta_docker_container_name"]
    regex = "/(.*)"
    target_label = "container"
  }

  rule {
    source_labels = ["__meta_docker_container_label_com_docker_swarm_service_name"]
    target_label = "service"
  }

  rule {
    source_labels = ["__meta_docker_container_label_com_docker_stack_namespace"]
    target_label = "stack"
  }
}

loki.source.docker "logs" {

  host = "unix:///var/run/docker.sock"

  targets = discovery.docker.containers.targets

  relabel_rules = discovery.relabel.logs.rules

  forward_to = [loki.process.parse_logs.receiver]
}

loki.process "parse_logs" {

  stage.docker {}

  stage.json {
    expressions = {
      level    = "level",
      trace_id = "trace_id",
      msg      = "msg",
      status   = "status",
      method   = "method",
      path     = "path",
    }
  }

  stage.labels {
    values = {
      level = "",
    }
  }

  forward_to = [loki.process.add_node.receiver]
}

loki.process "add_node" {
    stage.static_labels {
	values = {
	    node = env("NODE_HOSTNAME"),
	    id = env("NODE_ID"),
	}
    }
    forward_to = [loki.write.default.receiver]
}

loki.write "default" {

  endpoint {
    url = "http://loki:3100/loki/api/v1/push"
  }
}
