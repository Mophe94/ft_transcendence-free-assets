events {}

http {


    server {
        listen 80;
	listen [::]:80;
	return 301 https://$host$request_uri;
    }

    server {

        listen 443 ssl;
        server_name transcendence;

	ssl_certificate	    /run/secrets/nginx_crt;
	ssl_certificate_key /run/secrets/nginx_key;
	ssl_protocols	    TLSv1.2 TLSv1.3;


	location / {
	    proxy_pass http://frontend:5173;
	    proxy_http_version 1.1;
	    proxy_set_header Upgrade $http_upgrade;
	    proxy_set_header Connection "upgrade";
	    proxy_set_header Host $host;
	}

	location /users {
	    rewrite ^/users(/.*)$ $1 break;
	    proxy_pass http://users_service:3000;
	    
	    proxy_set_header Host $host;
	    proxy_set_header X-Real-IP $remote_addr;
	    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	    proxy_set_header X-Forwarded-Proto $scheme;
	}

	location /chat {
	    proxy_pass http://chat_service:3000;
	
	    proxy_http_version 1.1;
	    proxy_set_header Upgrade $http_upgrade;
	    proxy_set_header Connection "upgrade";
	    
	    proxy_set_header Host $host;
	    proxy_set_header X-Real-IP $remote_addr;
	    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	    proxy_set_header X-Forwarded-Proto $scheme;
	}

	location /game {
	    proxy_pass http://game_service:8081;
	    
	    proxy_http_version 1.1;
	    proxy_set_header Upgrade $http_upgrade;
	    proxy_set_header Connection "upgrade";
	    
	    proxy_set_header Host $host;
	    proxy_set_header X-Real-IP $remote_addr;
	    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	    proxy_set_header X-Forwarded-Proto $scheme;
	}

	location /lobby {
	    proxy_pass http://game_service:8081;
	    
	    proxy_http_version 1.1;
	    
	    proxy_set_header Upgrade $http_upgrade;
	    proxy_set_header Connection "upgrade";
	    
	    proxy_set_header Host $host;
	    proxy_set_header X-Real-IP $remote_addr;
	    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	    proxy_set_header X-Forwarded-Proto $scheme;
	    proxy_buffering off;
	}

	location /iframe/ {
	    proxy_pass http://game:8060/; 
	    
	    proxy_set_header Host $host;
	    proxy_set_header X-Real-IP $remote_addr;
	    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	    proxy_set_header X-Forwarded-Proto $scheme;
	}

        location /grafana/ {
	    set $upstream_var metrics_grafana;
	    resolver 127.0.0.11 valid=30s;
            proxy_pass http://$upstream_var:3000;
 
	    proxy_buffering off;
	    proxy_request_buffering off;
	    chunked_transfer_encoding on;
            client_max_body_size 0;

	    proxy_intercept_errors on;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

#        location /prometheus/ {
#            proxy_pass http://prometheus:9090;
#        }

    }

    server {
	listen 5050 ssl;
	server_name registry;

	ssl_certificate	    /run/secrets/registry_crt;
	ssl_certificate_key /run/secrets/registry_key;
	ssl_protocols	    TLSv1.2 TLSv1.3;

        location /v2/ {
	    set $upstream_var core_registry;
	    resolver 127.0.0.11 valid=30s;
            proxy_pass http://$upstream_var:5000;

	    proxy_buffering off;
	    proxy_request_buffering off;
	    chunked_transfer_encoding on;
            client_max_body_size 0;

	    proxy_set_header Host $http_host;
	    proxy_set_header X-Real-IP $remote_addr;
	    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	    proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
