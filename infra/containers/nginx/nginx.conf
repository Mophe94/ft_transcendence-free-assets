    }

    server {
	listen 5050 ssl;
	server_name registry;

	ssl_certificate	    /run/secrets/registry_crt;
	ssl_certificate_key /run/secrets/registry_key;
	ssl_protocols	    TLSv1.2 TLSv1.3;

        location /v2/ {
	    set $upstream_var core_registry;
	    resolver 127.0.0.11 valid=30s;
            proxy_pass http://$upstream_var:5000;

	    proxy_buffering off;
	    proxy_request_buffering off;
	    chunked_transfer_encoding on;
            client_max_body_size 0;

	    proxy_set_header Host $http_host;
	    proxy_set_header X-Real-IP $remote_addr;
	    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	    proxy_set_header X-Forwarded-Proto $scheme;

	    proxy_connect_timeout 5s;
	    proxy_read_timeout 300s;
	    proxy_send_timeout 300s;

	    proxy_next_upstream error timeout http_502 http_503 http_504;
	    proxy_next_upstream_tries 3;
        }
    }

    server {
        listen 443 ssl;
        server_name grafana.localhost;

	ssl_certificate	    /run/secrets/nginx_crt;
	ssl_certificate_key /run/secrets/nginx_key;
	ssl_protocols	    TLSv1.2 TLSv1.3;

        location / {
	    set $upstream_var observ_grafana;
	    resolver 127.0.0.11 valid=30s;
            proxy_pass http://$upstream_var:3000;

            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
