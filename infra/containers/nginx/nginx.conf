events {}

http {


    server {

        listen 80;
        server_name transcendence;

        location / {
	    set $upstream_var website_frontend;
	    resolver 127.0.0.11 valid=30s;
            proxy_pass http://$upstream_var:5173;

	    add_header 'Access-Control-Allow-Origin' '*';
#	    proxy_intercept_errors on;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
	    #add forward header upgradable and connection for the websockects
	    proxy_set_header Upgrade $http_upgrade;
	    proxy_set_header Connection "upgrade";

	    proxy_redirect off;
        }

        location /grafana/ {
	    set $upstream_var metrics_grafana;
	    resolver 127.0.0.11 valid=30s;
            proxy_pass http://$upstream_var:3000;
 
	    proxy_buffering off;
	    proxy_request_buffering off;
	    chunked_transfer_encoding on;
            client_max_body_size 0;

	    proxy_intercept_errors on;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

#        location /prometheus/ {
#            proxy_pass http://prometheus:9090;
#        }

    }

    server {
	listen 5050;
	server_name registry;

        location /v2/ {
	    set $upstream_var core_registry;
	    resolver 127.0.0.11 valid=30s;
            proxy_pass http://$upstream_var:5000;

	    proxy_buffering off;
	    proxy_request_buffering off;
	    chunked_transfer_encoding on;
            client_max_body_size 0;

	    proxy_intercept_errors on;
	    proxy_set_header Host $http_host;
	    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        }
    }
}
