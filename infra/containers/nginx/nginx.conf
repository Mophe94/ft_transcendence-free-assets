events {}

http {
    include /etc/nginx/conf.d/logging.conf;

    resolver 127.0.0.11 valid=30s ipv6=off;
    resolver_timeout 5s;

    map $http_upgrade $connection_upgrade {
	default upgrade;
	'' close;
    }

    server {
        listen 80;
	listen [::]:80;
        server_name transcendence;
	return 301 https://$host:8443$request_uri;
    }

    server {

        listen 443 ssl;
        server_name transcendence;

	ssl_certificate	    /run/secrets/nginx_crt;
	ssl_certificate_key /run/secrets/nginx_key;
	ssl_protocols	    TLSv1.2 TLSv1.3;

	add_header 'Access-Control-Allow-Origin' '*';

	location / {
	    set $upstream_var website_frontend;
	    resolver 127.0.0.11 valid=30s;
            proxy_pass http://$upstream_var:5173;

	    proxy_http_version 1.1;
	    proxy_set_header Upgrade $http_upgrade;
	    proxy_set_header Connection "upgrade";
	    proxy_set_header Host $http_host;

	    proxy_connect_timeout 5s;
	    proxy_read_timeout 60s;
	    proxy_send_timeout 60s;

	    proxy_next_upstream error timeout http_502 http_503 http_504;
	    proxy_next_upstream_tries 3;
	}

	location /users {
	    set $upstream_var website_users_service;
	    resolver 127.0.0.11 valid=30s;
	    rewrite ^/users(/.*)$ $1 break;
            proxy_pass http://$upstream_var:3000;

	    proxy_set_header Host $http_host;
	    proxy_set_header X-Real-IP $remote_addr;
	    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	    proxy_set_header X-Forwarded-Proto $scheme;

	    proxy_connect_timeout 5s;
	    proxy_read_timeout 60s;
	    proxy_send_timeout 60s;

	    proxy_next_upstream error timeout http_502 http_503 http_504;
	    proxy_next_upstream_tries 3;
	}

	location /chat {
	    set $upstream_var website_chat_service;
	    resolver 127.0.0.11 valid=30s;
            proxy_pass http://$upstream_var:3000;
	
	    proxy_http_version 1.1;
	    proxy_set_header Upgrade $http_upgrade;
	    proxy_set_header Connection $connection_upgrade;
	    
	    proxy_set_header Host $http_host;
	    proxy_set_header X-Real-IP $remote_addr;
	    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	    proxy_set_header X-Forwarded-Proto $scheme;

	    proxy_connect_timeout 5s;
	    proxy_read_timeout 60s;
	    proxy_send_timeout 60s;

	    proxy_next_upstream error timeout http_502 http_503 http_504;
	    proxy_next_upstream_tries 3;
	}

	location /game {
	    set $upstream_var website_game_service;
	    resolver 127.0.0.11 valid=30s;
            proxy_pass http://$upstream_var:8081;
	    
	    proxy_http_version 1.1;
	    proxy_set_header Upgrade $http_upgrade;
	    proxy_set_header Connection $connection_upgrade;
	    
	    proxy_set_header Host $http_host;
	    proxy_set_header X-Real-IP $remote_addr;
	    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	    proxy_set_header X-Forwarded-Proto $scheme;

	    proxy_connect_timeout 5s;
	    proxy_read_timeout 60s;
	    proxy_send_timeout 60s;

	    proxy_next_upstream error timeout http_502 http_503 http_504;
	    proxy_next_upstream_tries 3;
	}

	location /lobby {
	    set $upstream_var website_game_service;
	    resolver 127.0.0.11 valid=30s;
            proxy_pass http://$upstream_var:8081;
	    
	    proxy_http_version 1.1;
	    
	    proxy_set_header Upgrade $http_upgrade;
	    proxy_set_header Connection $connection_upgrade;
	    
	    proxy_set_header Host $http_host;
	    proxy_set_header X-Real-IP $remote_addr;
	    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	    proxy_set_header X-Forwarded-Proto $scheme;
	    proxy_buffering off;

	    proxy_connect_timeout 5s;
	    proxy_read_timeout 60s;
	    proxy_send_timeout 60s;

	    proxy_next_upstream error timeout http_502 http_503 http_504;
	    proxy_next_upstream_tries 3;
	}

	location /iframe/ {
	    set $upstream_var website_game;
	    resolver 127.0.0.11 valid=30s;
            proxy_pass http://$upstream_var:8060;
	    
	    proxy_set_header Host $http_host;
	    proxy_set_header X-Real-IP $remote_addr;
	    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	    proxy_set_header X-Forwarded-Proto $scheme;

	    proxy_connect_timeout 5s;
	    proxy_read_timeout 60s;
	    proxy_send_timeout 60s;

	    proxy_next_upstream error timeout http_502 http_503 http_504;
	    proxy_next_upstream_tries 3;
	}

