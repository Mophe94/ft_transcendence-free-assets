events {}

http {

    resolver 127.0.0.11;

    server {

        listen 80;
        server_name transcendence;

        location / {
                return 200 "NGINX ON - Swarm listening\n";
        }

        location /grafana/ {
            proxy_pass http://grafana:3000;
        }

        location /prometheus/ {
            proxy_pass http://prometheus:9090;
        }

    }
}
