log_format json_logs escape=json
'{'
    '"time":"$time_iso8601",'
    '"remote_addr":"$remote_addr",'
    '"method":"$request_method",'
    '"uri":"$request_uri",'
    '"status":"$status",'
    '"response_time":"$request_time",'
    '"service":"nginx"'
'}';

access_log /dev/stdout json_logs;
error_log /dev/stderr warn;
