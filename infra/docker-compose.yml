services:

  manager:
    build: ./manager
    container_name: swarm-manager
    hostname: manager
    privileged: true

    environment:
      SWARM_IP: 10.10.0.2

    volumes:
      - swarm-data:/swarm
      - manager-data:/var/lib/docker

    networks:
      swarm-net:
        ipv4_address: 10.10.0.2

    ports:
      - "2377:2377"
      - "7946:7946/tcp"
      - "7946:7946/udp"
      - "4789:4789/udp"

  worker:
    build: ./worker
    container_name: swarm-worker
    hostname: worker
    privileged: true

    environment:
      SWARM_MANAGER: 10.10.0.2

    depends_on:
      - manager

    volumes:
      - swarm-data:/swarm
      - worker-data:/var/lib/docker

    networks:
      swarm-net:
        ipv4_address: 10.10.0.3

volumes:
  swarm-data:
  manager-data:
  worker-data:

networks:
  swarm-net:
    driver: bridge

    ipam:
      config:
        - subnet: 10.10.0.0/24
