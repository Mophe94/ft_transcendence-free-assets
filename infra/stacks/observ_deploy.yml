services:

    prometheus:
      image: prom/prometheus
      user: "${PROMETHEUS_UID}:${PROMETHEUS_GID}"
      command:
        - "--web.enable-remote-write-receiver"
        - "--config.file=/etc/prometheus/prometheus.yml"
      configs:
        - source: prometheus_config
          target: /etc/prometheus/prometheus.yml
      deploy:
        replicas: 1
        placement:
          constraints:
            - node.role == manager
      volumes:
        - prom_data:/prometheus
      networks:
        - obsrv_net

    grafana:
      image: grafana/grafana:13.2
      user: "${GRAFANA_UID}:${GRAFANA_GID}"
      configs:
        - source: grafana_datasources
          target: /etc/grafana/provisioning/datasources/datasources.yml
        - source: grafana_dashboards
          target: /etc/grafana/provisioning/dashboards/dashboards.yml
      environment:
        - GF_SERVER_ROOT_URL=https://${HOST_IP}/grafana/
        - GF_SERVER_SERVE_FROM_SUB_PATH=true
        - GF_SECURITY_ALLOW_EMBEDDING=true
        - GF_AUTH_ANONYMOUS_ENABLED=true
        - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
        - GF_SECURITY_ADMIN_USER__FILE=/run/secret/grafana_admin_user
        - GF_SECURITY_ADMIN_PASSWORD__FILE=/run/secrets/grafana_admin_password
      secrets:
        - grafana_admin_user
        - grafana_admin_password
      networks:
        - obsrv_net
      volumes:
        - grafana_data:/var/lib/grafana
      deploy:
        replicas: 1
        placement:
          constraints:
            - node.role == manager

    loki:
      image: grafana/loki:3.5.2
      user: "${LOKI_UID}:${LOKI_GID}"
      volumes:
        - loki_data:/loki
      configs:
        - source: loki_config
          target: /etc/loki/config.yml
      networks:
        - obsrv_net
      command:
        - config.file=/etc/loki/config.yml
      deploy:
        replicas: 1
        placement:
          constraints:
            - node.role == manager

    alloy:
      image: grafana/alloy:latest
      user: "0:0"
      configs:
        - source: alloy_config
          target: /etc/alloy/config.alloy
      environment:
        - NODE_HOSTNAME="{{.Node.Hostname}}"
        - NODE_ID="{{.Node.ID}}"
      command:
        - run
        - --storage.path=/var/lib/alloy/data
        - /etc/alloy/config.alloy
      networks:
        - obsrv_net
      volumes:
        - /dev:/dev:ro
        # Unix exporter
        - /proc:/host/proc:ro
        - /sys:/host/sys:ro
        - /:/host/root:ro
        # cAdvisor
        - /sys:/sys:ro
        - /:/rootfs:ro
        - /var/run:/var/run
        - /var/lib/docker:/var/lib/docker:ro
        # Docker API
        - /var/run/docker.sock:/var/run/docker.sock
      deploy:
        mode: global

volumes:
    loki_data:
      driver: local
      driver_opts:
        type: nfs
        o: "addr=${NFS_IP},nfsvers=4,rw,soft"
        device: ":/nfs-storage/loki"
    prom_data:
      driver: local
      driver_opts:
        type: nfs
        o: "addr=${NFS_IP},nfsvers=4,rw,soft"
        device: ":/nfs-storage/prometheus"
    grafana_data:
      driver: local
      driver_opts:
        type: nfs
        o: "addr=${NFS_IP},nfsvers=4,rw,soft"
        device: ":/nfs-storage/grafana"

configs:
    prometheus_config:
        file: ../containers/prometheus/prometheus.yml
    grafana_datasources:
        file: ../containers/grafana/provisioning/datasources/datasources.yml
    grafana_dashboards:
        file: ../containers/grafana/provisioning/dashboards/dashboards.yml
    loki_config:
        file: ../containers/loki/loki_config.yml
    alloy_config:
        file: ../containers/alloy/alloy.conf
secrets:
    grafana_admin_user:
        external: true
    grafana_admin_password:
        external: true

networks:
    obsrv_net:
        external: true
    site_net:
        external: true
    games_net:
        external: true
