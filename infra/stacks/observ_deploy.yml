services:

  prometheus:
    image: prom/prometheus
    user: "${PROMETHEUS_UID}:${PROMETHEUS_GID}"
    command:
      - "--web.enable-remote-write-receiver"
      - "--config.file=/etc/prometheus/prometheus.yml"
    configs:
      - source: prometheus_config
        target: /etc/prometheus/prometheus.yml

    deploy:
      labels:
          prometheus_scrape: "false"
          prometheus_port: "${PROM_SCRAPE_PORT}"
      replicas: 1
      placement:
        constraints:
          - node.role == manager
    volumes:
      - prom_data:/prometheus
    networks:
      - obsrv_net
#      - site_net
#      - games_net

  grafana:
    image: grafana/grafana:13.2
    user: "${GRAFANA_UID}:${GRAFANA_GID}"
    configs:
        - source: grafana_datasources
          target: /etc/grafana/provisioning/datasources/datasources.yml
        - source: grafana_dashboards
          target: /etc/grafana/provisioning/dashboards/dashboards.yml
    deploy:
      labels:
          prometheus_scrape: "false"
          prometheus_port: "${PROM_SCRAPE_PORT}"
      replicas: 1
      placement:
        constraints:
          - node.role == manager
    environment:
        - GF_SERVER_ROOT_URL=https://${HOST_IP}/grafana/
        - GF_SERVER_SERVE_FROM_SUB_PATH=true
        - GF_SECURITY_ALLOW_EMBEDDING=true
        - GF_AUTH_ANONYMOUS_ENABLED=true
        - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
        - GF_SECURITY_ADMIN_USER__FILE=/run/secret/grafana_admin_user
        - GF_SECURITY_ADMIN_PASSWORD__FILE=/run/secrets/grafana_admin_password
    secrets:
        - grafana_admin_user
        - grafana_admin_password
    volumes:
        - grafana_data:/var/lib/grafana
    networks:
        - obsrv_net

  loki:
    user: "${LOKI_UID}:${LOKI_GID}"
    image: grafana/loki:3.5.2
    command:
      -config.file=/etc/loki/config.yml
    volumes:
      - loki_data:/loki
    configs:
      - source: loki_config
        target: /etc/loki/config.yml
    networks:
      - obsrv_net
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure

  alloy:
    image: grafana/alloy:latest
    command:
      - run
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    configs:
      - source: alloy_config
        target: /etc/alloy/config.alloy
    volumes:
      # Unix exporter
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/root:ro

      # cAdvisor
      - /sys:/sys:ro
      - /:/rootfs:ro
      - /var/run:/var/run
      - /var/lib/docker:/var/lib/docker:ro

      # Docker API
      - /var/run/docker.sock:/var/run/docker.sock

      - /dev:/dev:ro
    environment:
      - NODE_HOSTNAME="{{.Node.Hostname}}"
      - NODE_ID="{{.Node.ID}}"
    networks:
      - obsrv_net
    deploy:
      mode: global
      restart_policy:
        condition: on-failure

volumes:
    loki_data:
      driver: local
      driver_opts:
        type: nfs
        o: "addr=${NFS_IP},nfsvers=4,rw,soft"
        device: ":/nfs-storage/loki"
    prom_data:
      driver: local
      driver_opts:
        type: nfs
        o: "addr=${NFS_IP},nfsvers=4,rw,soft"
        device: ":/nfs-storage/prometheus"
    grafana_data:
      driver: local
      driver_opts:
        type: nfs
        o: "addr=${NFS_IP},nfsvers=4,rw,soft"
        device: ":/nfs-storage/grafana"

configs:
    prometheus_config:
        file: ../containers/prometheus/prometheus.yml
    grafana_datasources:
        file: ../containers/grafana/provisioning/datasources/datasources.yml
    grafana_dashboards:
        file: ../containers/grafana/provisioning/dashboards/dashboards.yml
    loki_config:
        file: ../containers/loki/loki_config.yml
    alloy_config:
        file: ../containers/alloy/alloy.conf
secrets:
    grafana_admin_user:
        external: true
    grafana_admin_password:
        external: true

networks:
    obsrv_net:
        external: true
    site_net:
        external: true
    games_net:
        external: true
