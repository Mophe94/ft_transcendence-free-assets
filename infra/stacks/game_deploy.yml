services:
    game_service:
        image: ${HOST_TAILSCALE_IP}:${REGISTRY_PORT}/backend:latest
        environment:
          - DB_GAME_HOST=game_db
        secrets:
          - db_game_db_name
          - db_game_username
          - db_game_password
          - jwt_secret_key
          - redis_password
        command:
          - node
          - dist/apps/game-service/main.js
        networks:
            - games_net
        deploy:
            labels:
                prometheus_scrape: "false"
                prometheus_port: "${PROM_SCRAPE_PORT}"
            replicas: 1
        healthcheck:
          test: ["CMD", "/app/healthcheck.sh"]
          interval: 15s
          timeout: 3s
          retries: 3
          start_period: 15s

    redis:
        image: ${HOST_TAILSCALE_IP}:${REGISTRY_PORT}/redis:latest
        secrets:
         - redis_password 
        networks:
            - games_net
        deploy:
            labels:
                prometheus_scrape: "false"
                prometheus_port: "${PROM_SCRAPE_PORT}"
            replicas: 1
        healthcheck:
          test: ["CMD-SHELL", "/app/healthcheck.sh"]
          interval: 15s
          timeout: 3s
          retries: 3
          start_period: 15s

    game:
        image: ${HOST_TAILSCALE_IP}:${REGISTRY_PORT}/game:latest
        command:
          - node
          - server.js
        networks:
            - games_net
        deploy:
            labels:
                prometheus_scrape: "false"
                prometheus_port: "${PROM_SCRAPE_PORT}"
            replicas: 1
        healthcheck:
          test: ["CMD", "node", "/app/healthcheck.js"]
          interval: 5s
          timeout: 3s
          retries: 3
          start_period: 15s

    game_db:
        image: ${HOST_TAILSCALE_IP}:${REGISTRY_PORT}/game_db:latest
#        env_file:
#          - "site/databases/game_db/.env"
#        configs:
#          - source: load_secrets
#            target: /load_secrets.sh
#            mode: 0555
        environment:
          - POSTGRES_PASSWORD=$$(cat "/run/secrets/db_users_postgres_password")
        secrets:
          - db_game_db_name
          - db_game_username
          - db_game_password
          - db_game_postgres_password
#        entrypoint:
#          - /load_secrets.sh
#        command:
#          - /usr/local/bin/docker-entrypoint.sh 
#          - postgres
        volumes:
          - game_data:/var/lib/postgresql/
        networks:
            - games_net
        deploy:
            labels:
                prometheus_scrape: "false"
                prometheus_port: "${PROM_SCRAPE_PORT}"
            replicas: 1
            placement:
              constraints:
                - node.labels.leader == true
        healthcheck:
          test: ["CMD-SHELL", "pg_isready -U postgres"]
          interval: 3s
          timeout: 5s
          retries: 5
          start_period: 5s

networks:
  games_net:
    external: true

volumes:
  game_data:
#    driver: local
#    driver_opts:
#        type: none
#        o: bind
#        device: /var/lib/postgresql/data

#configs:
secrets:
  db_game_db_name:
    external: true
  db_game_username:
    external: true
  db_game_password:
    external: true
  db_game_postgres_password:
    external: true
  jwt_secret_key:
    external: true
  redis_password:
    external: true
