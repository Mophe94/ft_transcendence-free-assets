services:

    nginx:
        image: nginx:alpine
        ports:
            - "80:80"
            - "443:443"
            - "5050:5050"
        configs:
            - source: nginx_conf
              target: /etc/nginx/nginx.conf
            - source: nginx_log
              target: /etc/nginx/conf.d/logging.conf
        secrets:
          - nginx_crt
          - nginx_key
          - registry_crt
          - registry_key
          - ca_crt
        networks:
          - swarm_net
          - obsrv_net
          - games_net
          - site_net
        volumes:
          - frontend:/usr/share/nginx/html:ro
        deploy:
          replicas: 1
          placement:
            constraints:
              - node.labels.leader == true
          restart_policy:
            condition: on-failure
            delay: 5s
            max_attempts: 5

    registry:
        image: registry:2
        environment:
          REGISTRY_STORAGE_DELETE_ENABLED: "true"
        volumes:
          - registry_data:/var/lib/registry
        networks:
          - swarm_net
        deploy:
          replicas: 1
          placement:
            constraints:
              - node.labels.leader == true
          restart_policy:
            condition: on-failure
            delay: 5s
            max_attempts: 5

volumes:
    frontend:
      driver: local
      driver_opts:
        type: nfs
        o: "addr=${IP},nfsvers=4,rw,soft"
        device: ":/nfs-storage/frontend"
    registry_data:
      driver: local

configs:
    nginx_conf:
      file: ../containers/nginx/nginx.conf
    nginx_log:
      file: ../containers/nginx/logging.conf

secrets:
    nginx_crt:
      external: true
    nginx_key:
      external: true
    registry_crt:
      external: true
    registry_key:
      external: true
    ca_crt:
      external: true

networks:
    swarm_net:
      external: true
    obsrv_net:
      external: true
    games_net:
      external: true
    site_net:
      external: true
