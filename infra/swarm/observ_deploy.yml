version: "3.8"

services:

  prometheus:
    image: prom/prometheus
    configs:
      - source: prometheus_config
        target: /etc/prometheus/prometheus.yml

    deploy:
      replicas: 0
      placement:
        constraints:
          - node.role == manager

    volumes:
      - prom_data:/prometheus
    networks:
      - obsrv_net

  grafana:
    image: grafana/grafana

    configs:
        - source: grafana_datasources
          target: /etc/grafana/provisioning/datasources/datasources.yml
        - source: grafana_dashboards
          target: /etc/grafana/provisioning/dashboards/dashboards.yml

    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager

    environment:
        - GF_SERVER_ROOT_URL=https://grafana.localhost/
        - GF_SERVER_SERVE_FROM_SUB_PATH=false
        - GF_SECURITY_ALLOW_EMBEDDING=true
        - GF_SECURITY_ADMIN_USER=admin
        - GF_SECURITY_ADMIN_PASSWORD=admin123

    volumes:
        - grafana_data:/var/lib/grafana
        - ../containers/grafana/dashboards:/var/lib/grafana/dashboards

    networks:
      - obsrv_net

  cadvisor:
    image: gcr.io/cadvisor/cadvisor
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks:
      - obsrv_net
    deploy:
      #mode: global
      replicas: 0
      
  loki:
    image: grafana/loki:3.5.2
    command:
      -config.file=/etc/loki/config.yml
    volumes:
      - loki-data:/loki
    configs:
      - source: loki_config
        target: /etc/loki/config.yml
    networks:
      - obsrv_net
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure

#  fluent-bit:
#    image: fluent/fluent-bit:3.0
#    volumes:
#      - /var/lib/docker/containers:/var/lib/docker/containers:ro
#      - /var/run/docker.sock:/var/run/docker.sock:ro
#      - fluent-bit_data:/fluent-bit/storage
#
#    configs:
#      - source: fluent-bit_config
#        target: /fluent-bit/etc/fluent-bit.conf
#      - source: parsers_config
#        target: /fluent-bit/etc/parsers.conf
#      - source: lua_http_level
#        target: /fluent-bit/scripts/http_level.lua
#    
#    command: ["/fluent-bit/bin/fluent-bit", "-c", "/fluent-bit/etc/fluent-bit.conf"]
#    
#    networks:
#      - obsrv_net
#    
#    deploy:
#      mode: global
#      restart_policy:
#        condition: any

  alloy:
    image: grafana/alloy:latest

    command:
      - run
      - /etc/alloy/config.alloy

    configs:
      - source: alloy_config
        target: /etc/alloy/config.alloy

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

    environment:
      - NODE_HOSTNAME="{{.Node.Hostname}}"
      - NODE_ID="{{.Node.ID}}"

    deploy:
      mode: global

    networks:
      - obsrv_net

volumes:
    loki-data:
      driver: local
      driver_opts:
        type: nfs
        o: "addr=${IP},nfsvers=4,rw,soft"
        device: ":/nfs-storage/loki"
    prom_data:
      driver: local
      driver_opts:
        type: nfs
        o: "addr=${IP},nfsvers=4,rw,soft"
        device: ":/nfs-storage/prometheus"
    grafana_data:
      driver: local
      driver_opts:
        type: nfs
        o: "addr=${IP},nfsvers=4,rw,soft"
        device: ":/nfs-storage/grafana"
    fluent-bit_data:

configs:
    prometheus_config:
        file: ../containers/prometheus/prometheus.yml
    grafana_datasources:
        file: ../containers/grafana/provisioning/datasources/datasources.yml
    grafana_dashboards:
        file: ../containers/grafana/provisioning/dashboards/dashboards.yml
    loki_config:
        file: ../containers/loki/loki_config.yml
    alloy_config:
        file: ../containers/alloy/alloy.conf
    fluent-bit_config:
        file: ../containers/fluent-bit/fluent-bit.conf
    parsers_config:
        file: ../containers/fluent-bit/parsers.conf
    lua_http_level:
        file: ../containers/fluent-bit/http_level.lua

networks:
    obsrv_net:
        external: true
