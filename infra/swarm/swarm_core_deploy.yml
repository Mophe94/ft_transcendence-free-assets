services:

    nginx:
        image: nginx:alpine

        ports:
            - "80:80"
            - "443:443"
      #- target: 80
      #  published: 8080
      #  protocol: tcp
      #  mode: ingress

        configs:
            - source: nginx_conf
              target: /etc/nginx/nginx.conf

        networks:
            - swarm_net
            - obsrv_net
            - games_net

        deploy:
            replicas: 1
            placement:
                constraints:
                    - node.role == manager

#volumes:

configs:
    nginx_conf:
        file: ../containers/nginx/nginx.conf

networks:
    swarm_net:
        external: true
    obsrv_net:
        external: true
    games_net:
        external: true
