services:

    frontend:
        image: ${IP}:80/frontend:latest
        env_file:
          - "site/FrontEnd/.env"

        networks:
            - games_net

        deploy:
            replicas: 1

    backend:
        image: ${IP}:80/backend:latest
        env_file:
          - "site/BackEnd/.env"

        networks:
            - games_net
        deploy:
            replicas: 1

    users_db:
        image: ${IP}:80/users_db:latest
        env_file:
          - "site/databases/user_db/.env"

        networks:
            - games_net

        deploy:
            replicas: 1

    game_db:
        image: ${IP}:80/game_db:latest
        env_file:
          - "site/databases/game_db/.env"

        networks:
            - games_net

        deploy:
            replicas: 1

networks:
    games_net:
        external: true
    swarm_net:
        external: true
