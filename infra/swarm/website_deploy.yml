services:

    frontend:
        image: ${IP}:${REGISTRY_PORT}/frontend:latest

        environment:
          - VITE_DOMAIN_NAME=${HOST_IP}:8443
          - VITE_USERS_SERVICE=https://${HOST_IP}:8443/users
          - VITE_CHAT_SERVICE=wss://${HOST_IP}:8443/chat
          - VITE_GAME_SERVICE=wss://${HOST_IP}:8443/game
          - VITE_LOBBY_SERVICE=wss://${HOST_IP}:8443/lobby
          - VITE_42_OAUTH_CLIENT_ID=u-s4t2ud-e487562dd07b366dee9b3b29a8fd298cbcc4c96048e03e72a17e2de8e5211d57
          - VITE_42_OAUTH_REDIRECT_URI=https://${HOST_IP}:8443/auth/callback
          - VITE_42_OAUTH_API_LINK=https://api.intra.42.fr/oauth/authorize?client_id=u-s4t2ud-e487562dd07b366dee9b3b29a8fd298cbcc4c96048e03e72a17e2de8e5211d57&redirect_uri=https://${HOST_IP}:8443/auth/callback&response_type=code
          - VITE_42_OAUTH_API=http://nginx:420/fortytwoapi/oauth/token
          - VITE_IFRAME_SERVICE=http://nginx:420/iframe

        secrets:
          - fortytwo_client_id

        networks:
            - site_net

#        configs:
#          - source: load_secrets
#            target: /load_secrets.sh
#            mode: 0555

#        entrypoint:
#          - /load_secrets.sh

        command:
          - npm
          - run
          - dev

        deploy:
            replicas: 1

    chat_service:
        image: ${IP}:${REGISTRY_PORT}/backend:latest
#        env_file:
#          - "site/BackEnd/.env"

        networks:
            - site_net

        secrets:
          - db_game_db_name
          - db_game_username
          - db_game_password

        command:
          - npm
          - run
          - start:dev
          - game-service

        deploy:
            replicas: 1

    users_service:
        image: ${IP}:${REGISTRY_PORT}/backend:latest
#        env_file:
#          - "site/BackEnd/.env"

        environment:
          - DB_USERS_HOST=users_db
          - FORTYTWO_API_TOKENEXCHANGE=http://nginx:420/fortytwoapi/oauth/token
          - FORTYTWO_API_GETUSER=http://nginx:420/fortytwoapi/v2/me
          - FORTYTWO_REDIRECT_URI=https://${HOST_IP}:8443/auth/callback

        networks:
            - site_net

        secrets:
          - db_users_db_name
          - db_users_username
          - db_users_password
          - fortytwo_client_id
          - fortytwo_client_secret
          - jwt_secret_key

        command:
          - npm
          - run
          - start:dev
          - account-service

        deploy:
            replicas: 1

    users_db:
        image: ${IP}:${REGISTRY_PORT}/users_db:latest
#        env_file:
#          - "site/databases/user_db/.env"

        volumes:
          - users_data:/var/lib/postgresql/

        networks:
            - site_net

#        configs:
#          - source: load_secrets
#            target: /load_secrets.sh
#            mode: 0555

        environment:
          - POSTGRES_PASSWORD=$$(cat "/run/secrets/db_users_postgres_password")

        secrets:
          - db_users_db_name
          - db_users_username
          - db_users_password
          - db_users_postgres_password

#        entrypoint:
#          - /load_secrets.sh

#        command:
#          - /usr/local/bin/docker-entrypoint.sh 
#          - postgres

        deploy:
            replicas: 1

networks:
    site_net:
        external: true
    swarm_net:
        external: true

volumes:
  users_data:

configs:
  load_secrets:
    file: "$HOME/infra/swarm/scripts/load_secrets.sh"

secrets:
  db_users_db_name:
    external: true
  db_users_username:
    external: true
  db_users_password:
    external: true
  db_users_postgres_password:
    external: true
  fortytwo_client_id:
    external: true
  fortytwo_client_secret:
    external: true
  jwt_secret_key:
    external: true
  db_game_db_name:
    external: true
  db_game_username:
    external: true
  db_game_password:
    external: true
