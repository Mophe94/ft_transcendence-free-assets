version: "3.8"

services:

  prometheus:
    image: prom/prometheus
    configs:
      - source: prometheus_config
        target: /etc/prometheus/prometheus.yml
    volumes:
      - prom_data:/prometheus
    networks:
      - obsrv_net

  grafana:
    image: grafana/grafana

    configs:
        - source: grafana_datasources
          target: /etc/grafana/provisioning/datasources/datasources.yml
        - source: grafana_dashboards
          target: /etc/grafana/provisioning/dashboards/dashboards.yml

    environment:
        GF_SERVER_ROOT_URL: http://localhost/grafana/
        GF_SERVER_SERVE_FROM_SUB_PATH: "true"
        GF_SECURITY_ALLOW_EMBEDDING: "true"
        GF_SECURITY_ADMIN_USER: "admin"
        GF_SECURITY_ADMIN_PASSWORD: "admin123"

    volumes:
        - grafana_data:/var/lib/grafana
        - ../containers/grafana/dashboards:/var/lib/grafana/dashboards

    networks:
      - obsrv_net

  cadvisor:
    image: gcr.io/cadvisor/cadvisor
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks:
      - obsrv_net
    deploy:
      mode: global

volumes:
    prom_data:
    grafana_data:

configs:
    prometheus_config:
        file: ../containers/prometheus/prometheus.yml
    grafana_datasources:
        file: ../containers/grafana/provisioning/datasources/datasources.yml
    grafana_dashboards:
        file: ../containers/grafana/provisioning/dashboards/dashboards.yml

networks:
    obsrv_net:
        external: true
