services:

    registry:
      image: registry:2

      deploy:
        replicas: 1
        placement:
          constraints:
            - node.role == manager
        restart_policy:
          condition: on-failure
          delay: 5s
          max_attempts: 3

      volumes:
        - registry_data:/var/lib/registry

      networks:
        - swarm_net

    nginx:
        image: nginx:alpine

        ports:
            - "80:80"
            - "443:443"
            - "5050:5050"

        configs:
            - source: nginx_conf
              target: /etc/nginx/nginx.conf
            - source: nginx_log
              target: /etc/nginx/conf.d/logging.conf

        secrets:
          - nginx_crt
          - nginx_key
          - registry_crt
          - registry_key

        networks:
            - swarm_net
            - obsrv_net
            - games_net

        deploy:
            replicas: 1
            placement:
                constraints:
                    - node.role == manager

volumes:
  registry_data:
    driver: local
    driver_opts:
      type: nfs
      o: "addr=${IP},nfsvers=4,rw,soft"
      device: ":/nfs-storage/registry"

configs:
    nginx_conf:
      file: ../containers/nginx/nginx.conf
    nginx_log:
      file: ../containers/nginx/logging.conf

secrets:
  nginx_crt:
    external: true
  nginx_key:
    external: true
  registry_crt:
    external: true
  registry_key:
    external: true

networks:
    swarm_net:
        external: true
    obsrv_net:
        external: true
    games_net:
        external: true
