services:
    game_service:
        image: ${HOST_TAILSCALE_IP}:${REGISTRY_PORT}/backend:latest

        networks:
            - games_net

        environment:
          - DB_GAME_HOST=game_db

        secrets:
          - db_game_db_name
          - db_game_username
          - db_game_password

        command:
          - npm
          - run
          - start:dev
          - game-service

        deploy:
            replicas: 1

    redis:
        image: ${HOST_TAILSCALE_IP}:${REGISTRY_PORT}/redis:latest
        secrets:
         - redis_password 
        networks:
            - games_net


    game:
        image: ${HOST_TAILSCALE_IP}:${REGISTRY_PORT}/game:latest

        networks:
            - games_net

        command:
          - node
          - server.js

        deploy:
            replicas: 1

    game_db:
        image: ${HOST_TAILSCALE_IP}:${REGISTRY_PORT}/game_db:latest
#        env_file:
#          - "site/databases/game_db/.env"

        volumes:
          - game_data:/var/lib/postgresql/

        networks:
            - games_net

#        configs:
#          - source: load_secrets
#            target: /load_secrets.sh
#            mode: 0555

        environment:
          - POSTGRES_PASSWORD=$$(cat "/run/secrets/db_users_postgres_password")

        secrets:
          - db_game_db_name
          - db_game_username
          - db_game_password
          - db_game_postgres_password

#        entrypoint:
#          - /load_secrets.sh

#        command:
#          - /usr/local/bin/docker-entrypoint.sh 
#          - postgres

        deploy:
            replicas: 1

networks:
  games_net:
    external: true

volumes:
  game_data:
    driver: local
    driver_opts:
      type: nfs
      o: addr=${HOST_TAILSCALE_IP},rw,nfsvers=4
      device: ":/nfs-storage/game_data"

#configs:
secrets:
  db_game_db_name:
    external: true
  db_game_username:
    external: true
  db_game_password:
    external: true
  db_game_postgres_password:
    external: true
  redis_password:
    external: true
