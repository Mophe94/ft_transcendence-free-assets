services:

  registry:
    image: registry:2

    deploy:
      replicas: 1
      placement:
        constraints:
         - node.role == manager
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3

    secrets:
      - registry_tls_cert
      - registry_tls_key

    environment:
      REGISTRY_HTTP_ADDR: 0.0.0.0:5000
      REGISTRY_HTTP_TLS_CERTIFICATE: /run/secrets/registry_tls_cert
      REGISTRY_HTTP_TLS_KEY: /run/secrets/registry_tls_key

    ports:
      - "5000:5000"

    networks:
      - registry_net


  nginx:
    image: nginx
    deploy:
      replicas: 1
    hostname: nginx

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf

    ports:
#      - "8080:80"
#      - "8443:443"
      - target: 80
        published: 8080
        protocol: tcp
        mode: ingress

    networks:
      - transcendence
      - shared_net

#volumes:

secrets:
  registry_tls_cert:
    external: true
  registry_tls_key:
    external: true

networks:
  transcendence:
    driver: overlay
  registry_net:
    driver: overlay
  shared_net:
    external: true
